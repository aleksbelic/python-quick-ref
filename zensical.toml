[project]
site_name = "Python Quick Reference"
site_url = "https://abelic.com/python-quick-ref/"
site_description = "A quick reference for the Python programming language."
site_author = "Aleksandar Belic Aleksanchez"
repo_url = "https://github.com/aleksbelic/python-quick-ref"
repo_name = "aleksbelic/python-quick-ref"
edit_uri = "edit/main/docs/"
copyright = "Built by <a href=\"https://abelic.com\" target=\"_blank\" rel=\"noopener\">Aleksanchez</a>"
nav = [
  { "Home" = "index.md" },
  { "Setup" = [
    { "Python Installation" = "setup/python-installation.md" },
    { "Virtual Env" = "setup/virtual-env.md" },
    { "Tooling" = "setup/tooling.md" },
  ] },
  { "Basics" = [
    { "Syntax Basics" = "syntax.md" },
    { "Variables" = "variables.md" },
    { "Data Types" = "data-types.md" },
    { "Casting" = "casting.md" },
    { "Operators" = "operators.md" },
    { "Conditions" = "conditions.md" },
  ] },
  { "Data Structures" = [
    { "Strings" = "strings.md" },
    { "Lists" = "lists.md" },
    { "Tuples" = "tuples.md" },
    { "Sets" = "sets.md" },
    { "Dictionaries" = "dictionaries.md" },
    { "Comprehensions" = "comprehensions.md" },
    { "Collections" = "collections.md" },
    { "Mutable vs Immutable" = "mutable-immutable.md" },
  ] },
  { "Control Flow" = [
    { "Loops" = "loops.md" },
    { "Try–Except" = "try-except.md" },
  ] },
  { "Functions & OOP" = [
    { "Functions" = "functions.md" },
    { "Generators" = "generators.md" },
    { "Decorators" = "decorators.md" },
    { "Classes" = "classes.md" },
    { "Dunders" = "dunders.md" },
    { "Dataclasses" = "dataclasses.md" },
    { "Type Hints" = "type-hints.md" },
  ] },
  { "I/O & Modules" = [
    { "Input & Output" = "input.md" },
    { "Formatting" = "formatting.md" },
    { "Files & Paths" = "files.md" },
    { "CSV" = "csv.md" },
    { "JSON" = "json.md" },
    { "Dates & Times" = "datetime.md" },
    { "RegExp" = "regexp.md" },
    { "Imports & Packages" = "imports.md" },
    { "Scripts & CLI" = "scripts.md" },
    { "Logging" = "logging.md" },
  ] },
  { "Cheat Sheet" = "cheatsheet.md" },
  { "Examples" = [
    { "Fibonacci" = "examples/fibonacci.md" },
    { "Palindrome" = "examples/palindrome.md" },
    { "Prime Number" = "examples/prime-number.md" },
    { "Word Counter" = "examples/word-counter.md" },
    { "CSV Summary" = "examples/csv-summary.md" },
    { "File Renamer" = "examples/file-renamer.md" },
    { "Testing" = "examples/testing.md" },
  ] },
]

[project.extra]
generator = false

[project.theme]
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"