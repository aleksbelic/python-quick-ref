[project]
site_name = "Python Quick Reference"
copyright = "Built by <a href=\"https://abelic.com\" target=\"_blank\" rel=\"noopener\">Aleksanchez</a>"
nav = [
  { "Home" = "index.md" },
  { "Setup" = [
    { "Python Installation" = "setup/python-installation.md" },
    { "Virtual Env" = "setup/virtual-env.md" },
  ] },
  { "Chapters" = [
    { "Comments" = "comments.md" },
    { "Variables" = "variables.md" },
    { "Data Types" = "data-types.md" },
    { "Casting" = "casting.md" },
    { "Strings" = "strings.md" },
    { "Booleans" = "booleans.md" },
    { "Conditions" = "conditions.md" },
    { "Operators" = "operators.md" },
    { "Lists" = "lists.md" },
    { "Tuples" = "tuples.md" },
    { "Sets" = "sets.md" },
    { "Dictionaries" = "dictionaries.md" },
    { "While Loop" = "while-loop.md" },
    { "For Loop" = "for-loop.md" },
    { "Functions" = "functions.md" },
    { "Classes" = "classes.md" },
    { "Input" = "input.md" },
    { "Try–Except" = "try-catch.md" },
    { "Dunders" = "dunders.md" },
    { "Formatting" = "formatting.md" },
    { "CSV" = "csv.md" },
    { "RegExp" = "regexp.md" },
    { "Mutable vs Immutable" = "mutable-immutable.md" },
    { "Imports" = "imports.md" },
    { "Packages" = "modules.md" },
    { "Extras" = "extras.md" },
  ] },
  { "Examples" = [
    { "Fibonacci" = "examples/fibonacci.md" },
    { "Palindrome" = "examples/palindrome.md" },
    { "Prime Number" = "examples/prime-number.md" },
  ] },
  { "Testing" = "testing.md" },
]

[project.extra]
generator = false

[project.theme]
features = [
  "content.code.copy",
]

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"